name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ensure a Chromium-family browser
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq chromium || sudo apt-get install -y -qq chromium-browser
          fi
          command -v google-chrome || command -v chromium || command -v chromium-browser

      - name: Build the demo deck
        run: node bin/deckhand.js build examples/pitch dist

      - name: Audit (fails on overflow or any contract break)
        run: node bin/deckhand.js audit dist

      - name: Audit rejects a slide without a kicker
        run: |
          mkdir -p /tmp/broken
          cp examples/pitch/* /tmp/broken/
          sed -i '/class="kicker"/d' /tmp/broken/03.html
          node bin/deckhand.js build /tmp/broken /tmp/broken-dist > /dev/null
          if node bin/deckhand.js audit /tmp/broken-dist; then
            echo "audit should have failed on a slide without a kicker"
            exit 1
          fi

      - name: Audit exposes a machine-readable report
        run: |
          node bin/deckhand.js audit dist --json | node -e "
            let s=''; process.stdin.on('data', d => s += d).on('end', () => {
              const r = JSON.parse(s);
              if (!r.ok || r.slides.length !== 8) { console.error(s); process.exit(1); }
              console.log('json audit ok —', r.slides.length, 'slides');
            });
          "

      - name: Check the exported artefacts exist
        run: |
          test -s dist/deck.html
          test -s dist/deck.pdf
          test -s dist/png/01.png
          test -s dist/png/08.png

      - name: Build the Pages demo and check it is self-contained
        run: |
          node scripts/site.mjs
          test -s docs/index.html
          if grep -qE 'src="https?://|url\(https?://' docs/index.html; then
            echo "docs/index.html references an external resource"; exit 1
          fi
