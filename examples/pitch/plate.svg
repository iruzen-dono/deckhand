<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e2683a" opacity="0.14"/>
    </pattern>
    <clipPath id="frame"><rect width="1600" height="900"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#12110f"/>
  <rect width="1600" height="900" fill="url(#dots)"/>

  <g clip-path="url(#frame)">
    <circle cx="1180" cy="360" r="320" fill="none" stroke="#e2683a" stroke-width="1.5" opacity="0.9"/>
    <circle cx="1180" cy="360" r="232" fill="none" stroke="#e2683a" stroke-width="0.75" opacity="0.45"/>
    <circle cx="1180" cy="360" r="148" fill="#e2683a" opacity="0.09"/>
    <circle cx="1180" cy="360" r="4" fill="#e2683a"/>
  </g>

  <rect x="96" y="96" width="96" height="3" fill="#e2683a"/>
</svg>
